<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการร้านค้า | ตลาดนัดออนไลน์ อำเภอชาติตระการ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">
        <span class="logo-icon">⚙️</span>
        <div>
          <h1>จัดการร้านค้า</h1>
          <p>ตลาดนัดออนไลน์ อำเภอชาติตระการ</p>
        </div>
      </div>
      <a href="index.html" class="admin-btn">← กลับหน้าหลัก</a>
    </div>
  </header>

  <main class="container admin-page">
    <!-- ฟอร์มเพิ่ม / แก้ไข -->
    <section class="admin-form-section">
      <h2 id="form-title">เพิ่มร้านค้าใหม่</h2>
      <form id="shop-form" class="shop-form">
        <input type="hidden" id="shop-id" />

        <div class="form-group">
          <label for="shop-name">ชื่อร้าน *</label>
          <input type="text" id="shop-name" placeholder="เช่น ร้านป้าสมจิตร ผลไม้สด" required />
        </div>

        <div class="form-group">
          <label for="shop-icon">ไอคอน / รูปภาพ</label>
          <div class="icon-options">
            <select id="shop-icon-type">
              <option value="emoji">ใช้ Emoji</option>
              <option value="url">ใช้ URL รูปภาพ</option>
            </select>
            <input type="text" id="shop-icon" placeholder="🛒 หรือวางลิงก์รูปภาพ" value="🛒" />
          </div>
          <small>แนะนำ Emoji เช่น 🍎 🥬 🍖 ☕ 👕 หรือวาง URL รูปภาพ</small>
        </div>

        <div class="form-group">
          <label for="shop-link">ลิงก์ร้านค้า *</label>
          <input type="url" id="shop-link" placeholder="https://line.me/... หรือ https://facebook.com/..." required />
          <small>ลิงก์ไปยัง Line OA, Facebook Page, เว็บไซต์ หรือเบอร์โทร (tel:08xxxxxxx)</small>
        </div>

        <div class="form-group">
          <label for="shop-desc">รายละเอียดสั้น ๆ (ไม่บังคับ)</label>
          <input type="text" id="shop-desc" placeholder="เช่น ขายผักสดจากสวน ทุกวัน" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">เพิ่มร้านค้า</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">ยกเลิก</button>
        </div>
      </form>
    </section>

    <!-- รายการร้านค้าที่มีอยู่ -->
    <section class="admin-list-section">
      <div class="section-header">
        <h2>ร้านค้าทั้งหมด (<span id="shop-count">0</span>)</h2>
        <button type="button" class="btn btn-danger-outline" id="clear-all-btn">ล้างข้อมูลทั้งหมด</button>
      </div>

      <div id="admin-shop-list" class="admin-shop-list">
        <!-- รายการจะถูกโหลดที่นี่ -->
      </div>

      <div id="admin-empty" class="empty-state" style="display: none;">
        <p>ยังไม่มีร้านค้าในระบบ</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>ข้อมูลถูกเก็บไว้ในเบราว์เซอร์ของคุณ (localStorage)</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAdminPage();
    });
  </script>
</body>
</html>
